# Yerel/tek sunucu kurulumu: docker compose up -d --build
# İlk kurulumdan sonra:
#   docker compose exec app node dist-server/seed.js
#   docker compose exec -it app node dist-server/create-admin.js
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: nidaakin
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nida:${POSTGRES_PASSWORD}@db:5432/nidaakin?schema=public
      NODE_ENV: production
      TRUST_PROXY: 1
    ports:
      - "4000:4000"
    volumes:
      - storage:/app/storage
volumes:
  pgdata:
  storage:
